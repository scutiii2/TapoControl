[project]
name = "tapocontrol"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    "PySide6==6.12.0",
    "python-kasa==0.12.0",
    "tapo==0.12.2",
    "keyring==25.7.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pyinstaller==6.22.3",
    "ruff>=0.17.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "B"]
