ce.offline{background:transparent;border-style:dashed}.offline .device-icon{background:#ecefe9;color:#9aa49c}.offline h3,.offline .watts{color:#859087}.offline .dot{background:#a5ada6}.status{display:flex;gap:6px;align-items:center;font-size:10px;color:var(--muted);margin-top:19px}.status span:last-child{margin-left:auto}.switcher{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1f302a;color:white;box-shadow:0 7px 25px #12281b33;border:1px solid #ffffff30;border-radius:50px;display:flex;align-items:center;gap:16px;padding:7px 10px;z-index:9;font-size:11px}.switcher button{background:#ffffff12;border:0;color:white;border-radius:50%;padding:0;width:28px;height:28px}.switcher small{color:#adc3b4;font-size:9px;margin-right:6px}.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#233d30;color:white;padding:12px 22px;border-radius:10px;z-index:10;font-size:12px}.dark{--paper:#202625;--line:#343e39;--muted:#a0b0a6;--accent:#b8e695;background:#181e1b;color:#edf3ec;grid-template-columns:180px 1fr}.dark .sidebar{background:#1b221e}.dark .nav.active{background:#303e2b;color:#c3e5ad}.dark .network,.dark .device-icon{background:#29332c}.dark .stat:first-child{background:#bde59c;border-color:#bde59c;color:#22341d}.dark .stat:first-child label,.dark .stat:first-child em{color:#46613c}.dark .avatar span{background:#35402e}.dark .middle{grid-template-columns:1fr 260px}.dark .stats{grid-template-columns:1.4fr 1fr 1fr 1fr}.dark .tabs{background:#151b17}.dark .tabs button.selected{background:#384532;color:#ddf0d1}.dark .device{padding:22px}.dark .devices{grid-template-columns:repeat(2,1fr)}.dark .device-top{float:right;margin:0 0 0 15px;gap:20px}.dark .device .watts{margin:10px 0}.dark .intro{margin-bottom:24px}.dark .switch{background:#a7d584}.dark .device-icon{color:#b5d69f}.dark .device-foot{margin-top:13px}.dark .content{padding-top:26px}.dark .brandmark{background:#bde59c;color:#22341d}.compact{grid-template-columns:1fr;background:#fafaf8;min-height:850px}.compact .sidebar{display:none}.compact .content{padding:0 46px 90px}.compact .top{padding:22px 0;border-bottom:1px solid var(--line);margin-bottom:30px}.compact .crumb{font-size:18px;font-weight:600;color:#20322c}.compact .stats{background:transparent;border-bottom:1px solid var(--line);gap:0;padding-bottom:24px}.compact .stat,.compact .stat:first-child{border:0;border-radius:0;background:transparent;border-right:1px solid var(--line);padding:0 25px}.compact .stat:first-child{padding-left:0}.compact .stat:last-child{border:0}.compact .middle{display:none}.compact .devices{display:block;border:1px solid var(--line);border-radius:10px;overflow:hidden}.compact .device{border:0;border-bottom:1px solid var(--line);border-radius:0;display:grid;grid-template-columns:80px 1fr 150px 200px 160px;align-items:center;gap:20px;padding:19px 23px}.compact .device:last-child{border-bottom:0}.compact .device-top{margin:0;gap:20px;display:contents}.compact .device-icon{grid-column:1;grid-row:1 / 3}.compact .switch{grid-column:5;grid-row:1 / 3;justify-self:end}.compact .device h3{grid-column:2;grid-row:1;margin:0}.compact .device p{grid-column:2;grid-row:2;margin-top:-12px}.compact .device .watts{grid-column:3;grid-row:1 / 3;margin:0}.compact .device-foot{grid-column:4;grid-row:1 / 3;padding:0;border:0;font-size:11px;gap:20px}.compact .listcaption{display:block;font-size:10px;color:var(--muted);margin:0 0 12px 24px;letter-spacing:1px}.listcaption{display:none}.compact .status{margin-top:24px}.compact .note{display:block}.note{display:none;margin-top:28px;border-left:3px solid #7d9f70;padding:10px 18px;color:#69776b;font-size:12px;line-height:1.8}.dark .middle{margin-top:24px}.dark .sectionhead{margin-top:4px}@media(max-width:1050px){.app{grid-template-columns:170px 1fr}.content{padding:25px 24px 90px}.middle{grid-template-columns:1fr 210px}.devices{grid-template-columns:repeat(2,1fr)}.compact{grid-template-columns:1fr}.compact .device{grid-template-columns:4 </style></head><body><div id="root"></div><div class="switcher"><button id="prev" aria-label="Previous design">←</button><span id="variantlabel"></span><button id="next" aria-label="Next design">→</button><small>MOCKUP · SAMPLE DATA</small></div><div id="toast" role="status" hidden></div>
<script>
const icons={overview:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',devices:'<path d="M8 3v5m8-5v5M6 8h12v5a6 6 0 0 1-12 0V8Zm6 11v3"/>',energy:'<path d="m13 2-8 12h7l-1 8 8-13h-7l1-7Z"/>',settings:'<path d="M3 6h18M3 12h18M3 18h18"/><circle cx="8" cy="6" r="2"/><circle cx="16" cy="12" r="2"/><circle cx="10" cy="18" r="2"/>',account:'<circle cx="12" cy="8" r="4"/><path d="M4 22v-2a8 8 0 0 1 16 0v2"/>',monitor:'<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/>',fan:'<circle cx="12" cy="12" r="2"/><path d="M12 10c-8-11 7-11 2 0m0 3c13-1 7 12-1 1m-3-1C4 25-5 12 10 11"/>',lamp:'<path d="m8 3-4 12h16L16 3H8Zm4 12v6m-5 0h10"/>',coffee:'<path d="M4 7h13v8a6 6 0 0 1-13 0V7Zm13 1h2a3 3 0 0 1 0 6h-2M3 22h16"/>'};
const icon=name=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name]||icons.devices}</svg>`;
const devices=[{name:'Workstation',type:'monitor',ip:'192.0.2.21',watts:182.4,today:1.46,on:true,online:true,color:'#428362'},{name:'Living room fan',type:'fan',ip:'192.0.2.22',watts:42.8,today:.61,on:true,online:true,color:'#a4b875'},{name:'Desk lamp',type:'lamp',ip:'192.0.2.23',watts:0,today:.07,on:false,online:true,color:'#d2b985'},{name:'Coffee station',type:'coffee',ip:'192.0.2.24',watts:0,today:.2,on:false,online:false,color:'#aab4a9'}];
const names={A:'Quiet overview',B:'Device console',C:'Compact workspace'};let variant=new URLSearchParams(location.search).get('variant')||'A';if(!names[variant])variant='A';let activePage='overview';
function navigation(){return ['overview','devices','energy'].map(n=>`<div class="nav ${activePage===n?'active':''}">${icon(n)}${n[0].toUpperCase()+n.slice(1)}${n==='devices'?'<small>4</small>':''}</div>`).join('')}
function cards(){return devices.map((d,i)=>`<article class="device ${d.online?'':'offline'}"><div class="device-top"><div class="device-icon">${icon(d.type)}</div><button class="switch" role="switch" aria-label="Power ${d.name}" aria-checked="${d.on}" ${d.online?'':'disabled'} data-device="${i}"></button></div><h3>${d.name}</h3><p><span class="dot" style="${d.online?'':'background:#a5ada6'}"></span>${d.online?(d.on?'On':'Off'):'Offline'} · P110</p><div class="watts">${d.online?d.watts.toFixed(1):'—'}<span>W</span></div><div class="device-foot"><span>${d.today.toFixed(2)} kWh today</span><button data-details="${i}" aria-label="Details for ${d.name}">Details ↗</button></div></article>`).join('')}
function chart(){const points=[73,76,72,69,78,76,82,75,78,76,75,86,99,103,122,112,98,105,119,109,111,125,123,114,116,125,115,119,112,121,132,125,127,134,141,132,137,132,143,149,141,148,145,147,149,142,150,146,153,148,155];const path=points.map((v,i)=>`${i?'L':'M'} ${40+i*10.3} ${172-v}`).join(' ');return `<svg class="chart" viewBox="0 0 585 190" preserveAspectRatio="none" role="img" aria-label="Sample live power chart, last ten minutes"><defs><linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#91b88b" stop-opacity=".25"/><stop offset="1" stop-color="#91b88b" stop-opacity="0"/></linearGradient></defs>${[22,67,112,157].map((y,i)=>`<line x1="39" y1="${y}" x2="564" y2="${y}" stroke="currentColor" opacity=".07"/><text x="0" y="${y+3}">${300-i*100}</text>`).join('')}<path d="${path} L555 157 L40 157Z" fill="url(#area)"/><path d="${path}" fill="none" stroke="#578e61" stroke-width="2" stroke-linejoin="round"/><path d="M40 136L100 137 170 135 210 137 270 135 320 137 390 136 460 135 555 137" fill="none" stroke="#b0bb82" stroke-width="1.8"/>${['10 min ago','8 min','6 min','4 min','2 min','Now'].map((v,i)=>`<text x="${40+i*99}" y="183">${v}</text>`).join('')}</svg>`}
function render(){const total=devices.filter(d=>d.on).reduce((n,d)=>n+d.watts,0),on=devices.filter(d=>d.on).length;const stats=`<section class="stats" aria-label="Power summary"><div class="stat"><label>Power right now</label><div class="value">${total.toFixed(1)}<em>W</em></div><p>Across ${on} active plugs</p></div><div class="stat"><label>Used today</label><div class="value">2.34<em>kWh</em></div><p>Since midnight</p></div><div class="stat"><label>This month</label><div class="value">48.62<em>kWh</em></div><p>November so far</p></div><div class="stat"><label>Plugs online</label><div class="value">3<em>/ 4</em></div><p>1 plug needs attention</p></div></section>`;
const middle=`<section class="middle"><div class="panel"><div class="panelhead"><h2>Live power</h2><div class="tabs"><button class="selected" id="range">Last 10 minutes</button></div></div><div class="legend"><span><i style="background:#578e61"></i>Workstation</span><span><i style="background:#b0bb82"></i>Living room fan</span><span style="margin-left:auto">Watts</span></div>${chart()}</div><div class="panel breakdown"><h2>Today's usage</h2><div class="total">2.34 <small>kWh</small></div><p>Across all plugs</p><div class="stack">${devices.map(d=>`<i style="flex:${d.today};background:${d.color}"></i>`).join('')}</div>${devices.map(d=>`<div class="usage"><span><i class="dot" style="background:${d.color}"></i>${d.name}</span><b>${d.today.toFixed(2)}</b></div>`).join('')}</div></section>`;
const deviceSection=`<section><div class="sectionhead"><h2>Your devices <small>3 online · 1 offline</small></h2><div class="actions"><button data-all="true">Turn all on</button><button data-all="false">Turn all off</button></div></div><div class="listcaption">DEVICE / STATUS <span style="margin-left:30%">LIVE POWER</span><span style="margin-left:12%">TODAY</span></div><div class="devices">${cards()}</div></section>`;
document.getElementById('root').innerHTML=`<main class="app ${variant==='B'?'dark':variant==='C'?'compact':''}"><aside class="sidebar"><div class="brand"><span class="brandmark">⏻</span>TapoControl</div><div class="eyebrow navtitle">Workspace</div>${navigation()}<div class="bottom"><div class="network"><strong><i class="dot"></i>Local network</strong><p>3 plugs connected</p></div><div class="nav">${icon('settings')}Settings</div><div class="avatar"><span>TC</span><div>Tapo account<small>Signed in</small></div></div></div></aside><div class="content"><header class="top"><span class="crumb">${variant==='C'?'⏻  TapoControl':'Workspace / Overview'}</span><div class="topright"><span>Monday, November 2</span><button id="scan">↻ &nbsp; Scan network</button></div></header><div class="intro"><div><div class="eyebrow">YOUR HOME, AT A GLANCE</div><h1>${variant==='B'?'Power, under control.':variant==='C'?'Devices & power':'A little less energy. A little more control.'}</h1><p>${variant==='B'?'Every plug. Every watt. One place.':'Keep an eye on your usage. Switch things off when you’re done.'}</p></div><span class="live"><i class="dot"></i>Live · every 5s</span></div>${stats}${variant==='B'?deviceSection+middle:middle+deviceSection}<div class="note">One plug is offline. Coffee station’s last reading is unavailable. Check its power and Wi-Fi connection, then scan again.</div><footer class="status"><span><i class="dot"></i>Sample data · no devices connected</span><span>Runs quietly in your system tray</span></footer></div></main>`;
document.getElementById('variantlabel').textContent=`${variant} / ${names[variant]}`;document.querySelectorAll('[data-device]').forEach(b=>b.onclick=()=>{const d=devices[Number(b.dataset.device)];d.on=!d.on;d.watts=d.on?(d.type==='monitor'?182.4:d.type==='fan'?42.8:8.2):0;render()});document.querySelectorAll('[data-all]').forEach(b=>b.onclick=()=>{devices.filter(d=>d.online).forEach(d=>{d.on=b.dataset.all==='true';d.watts=d.on?(d.type==='monitor'?182.4:d.type==='fan'?42.8:8.2):0});render()});document.querySelectorAll('[data-details]').forEach(b=>b.onclick=()=>{const d=devices[Number(b.dataset.details)];notify(`${d.name} · ${d.ip} · ${d.today.toFixed(2)} kWh today · Sample device`)});document.getElementById('scan').onclick=()=>notify('Demo scan complete. 3 online · 1 offline. No network requests made.');document.getElementById('range').onclick=()=>notify('Preview shows last 10 minutes of sample readings.');}
let toastTimer;function notify(message){const e=document.getElementById('toast');e.className='toast';e.textContent=message;e.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.hidden=true,3500)}
function cycle(delta){const keys=Object.keys(names);variant=keys[(keys.indexOf(variant)+delta+keys.length)%keys.length];const url=new URL(location.href);url.searchParams.set('variant',variant);history.replaceState(null,'',url);render()}
document.getElementById('prev').onclick=()=>cycle(-1);document.getElementById('next').onclick=()=>cycle(1);document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();cycle(e.key==='ArrowRight'?1:-1)}});render();
</script>
<style>
.crumb{display:flex;align-items:center;gap:12px}
.sidebar-toggle{display:grid;place-items:center;width:32px;height:32px;padding:6px;background:transparent;border:1px solid transparent;border-radius:7px;color:var(--muted)}
.sidebar-toggle:hover{border-color:var(--line);background:var(--paper)}
.sidebar-toggle svg{width:19px;height:19px}
.app.collapsed{grid-template-columns:76px minmax(0,1fr)}
.collapsed .sidebar{padding:29px 13px}
.collapsed .brand{font-size:0;gap:0;justify-content:center}
.collapsed .brandmark{flex-shrink:0}
.collapsed .navtitle{font-size:0;margin:38px 0 12px}
.collapsed .nav{font-size:0;gap:0;justify-content:center;padding:13px 0}
.collapsed .nav svg{width:20px;height:20px;flex-shrink:0}
.collapsed .nav small,.collapsed .network{display:none}
.collapsed .avatar{padding:16px 0 0;justify-content:center}
.collapsed .avatar>div{display:none}
.compact .sidebar-toggle{display:none}
</style>
<script>
// Mockup-only: retain navigation labels as accessible tooltips in the narrow rail.
let sidebarCollapsed = false;
const renderLayout = render;
render = function () {
    renderLayout();
    const app = document.querySelector('.app');
    app.classList.toggle('collapsed', sidebarCollapsed && variant !== 'C');
    const sidebar = document.querySelector('.sidebar');
    sidebar.id = 'main-sidebar';
    document.querySelectorAll('.sidebar .nav').forEach(item => {
        const label = item.childNodes;
        const text = Array.from(label).filter(node => node.nodeType === Node.TEXT_NODE)
            .map(node => node.textContent).join('').trim();
        item.title = text;
        item.setAttribute('aria-label', text);
    });
    const toggle = document.createElement('button');
    toggle.className = 'sidebar-toggle';
    toggle.type = 'button';
    toggle.title = sidebarCollapsed ? 'Expand sidebar' : 'Collapse sidebar';
    toggle.setAttribute('aria-label', toggle.title);
    toggle.setAttribute('aria-expanded', String(!sidebarCollapsed));
    toggle.setAttribute('aria-controls', sidebar.id);
    toggle.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>';
    toggle.onclick = () => {
        sidebarCollapsed = !sidebarCollapsed;
        render();
        document.querySelector('.sidebar-toggle').focus();
    };
    document.querySelector('.crumb').prepend(toggle);
};
render();
</script></body></html>
